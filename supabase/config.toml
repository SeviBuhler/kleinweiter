project_id = "kleinweiter"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
# Production URL; exact localhost callbacks remain available for local development.
site_url = "https://kleinweiter.vercel.app"
additional_redirect_urls = ["https://kleinweiter.vercel.app/auth/callback", "http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
enable_signup = true
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 8
otp_expiry = 600

# Hosted Free project uses default link templates. With custom SMTP, the optional
# templates/otp.html can be configured in the Dashboard to send OTP codes instead.
